<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>

<title>Zollhaus Grundriss</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px;
  }
  .floorplan-wrap {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    overflow-x: auto;
  }
  svg { width: 100%; height: auto; display: block; }

  .table { cursor: pointer; transition: opacity 0.15s; }
  .table:hover { opacity: 0.8; }
  .table-octagon {
    fill: #5b7fa6;
    stroke: #3d5876;
    stroke-width: 2;
  }
  .table-num {
    fill: #ffffff;
    font-size: 15px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .wall { fill: none; stroke: #111; stroke-width: 6; }
  .wall-thin { fill: none; stroke: #111; stroke-width: 3; }
  .door-arc { fill: none; stroke: #111; stroke-width: 1.5; }
  .furniture { fill: #5b7fa6; stroke: #3d5876; stroke-width: 1.5; }
  .stair-line { stroke: #111; stroke-width: 1; }
</style>
